name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet-cli"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      # --- مراحل جدید برای نصب و تنظیم Android SDK ---
      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android/sdk
          echo "y" | sudo /opt/hostedtoolcache/AndroidSDK/cmdline-tools/latest/bin/sdkmanager --install "cmdline-tools;latest"
          echo "y" | sudo $HOME/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"
          echo "y" | sudo $HOME/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        env:
          ANDROID_SDK_ROOT: $HOME/android/sdk
          PATH: ${{ env.PATH }}:/opt/hostedtoolcache/AndroidSDK/cmdline-tools/latest/bin:$HOME/android/sdk/platform-tools

      - name: Build APK
        run: |
          flet build apk --python-version 3.11 --yes --verbose

      - name: Find APK
        run: |
          echo "APK files:"
          ls -la **/*.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MostafaPlayer-APK
          path: "**/*.apk"

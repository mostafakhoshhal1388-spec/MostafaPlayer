name: Build Flet APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: "stable"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Build APK
        run: |
          flet --version
          flutter --version
          flet build apk --yes

      - name: Debug: locate APKs
        if: always()
        run: |
          echo "PWD=$(pwd)"
          echo "Searching for APK files..."
          find . -type f \( -iname "*.apk" -o -iname "*.aab" \) -print

          echo "Show common output dirs:"
          ls -la || true
          ls -la build || true
          ls -la dist || true
          ls -la out || true

      - name: Upload APK/AAB (auto)
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: error

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet-cli"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses

      # نکته مهم: اینجا پایتون بیلد را 3.11 قفل می‌کنیم
      # تا مشکل watchdog روی python 3.14 پیش نیاید.
      - name: Build APK
        run: |
          flet build apk --python-version 3.11 --yes --verbose

      - name: Find APK
        run: |
          echo "APK files:"
          ls -la **/*.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MostafaPlayer-APK
          path: "**/*.apk"
